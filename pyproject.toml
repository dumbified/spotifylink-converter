[project]
name = "musiclink"
version = "0.1.0"
description = "WhatsApp bot that turns Spotify track links into Apple Music links"
readme = "README.md"
authors = [{ name = "yeeern" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
# Lets you type "uv run musiclink ..." in the terminal
musiclink = "musiclink.core.__main__:main"
# Starts the WhatsApp bot server: "uv run musiclink-bot"
musiclink-bot = "musiclink.main:run"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: basic errors, I: import order, B: likely bugs, S: security checks, UP: modern syntax
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# tests may use assert (S101) and contain made-up secrets (S105, S106)
"tests/*" = ["S101", "S105", "S106"]
